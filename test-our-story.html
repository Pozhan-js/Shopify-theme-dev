<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Story Test</title>
    <style>
        body {
            font-family: 'Noto Serif', serif;
            margin: 0;
            padding: 2rem;
            background: #faf9f7;
        }
        
        .test-container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .story-image {
            width: 100%;
            height: 300px;
            background: #e8e4de;
            border-radius: 0.5rem;
            margin-bottom: 2rem;
        }
        
        /* 复制我们添加的样式 */
        .story-text-inputs {
            margin-top: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        
        .text-input-container {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .text-input-label {
            font-size: 0.875rem;
            font-weight: 500;
            color: #4a3f32;
            margin-bottom: 0.25rem;
        }
        
        .story-text-input {
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            color: #4a3f32;
            background-color: #ffffff;
            border: 1px solid #d1c7b8;
            border-radius: 0.5rem;
            transition: all 0.3s ease;
            box-shadow: 0 2px 4px rgba(45, 36, 27, 0.05);
        }
        
        .story-text-input:focus {
            outline: none;
            border-color: #5a7c5a;
            box-shadow: 0 0 0 3px rgba(90, 124, 90, 0.1);
        }
        
        .story-text-input::placeholder {
            color: #8b7d68;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>Our Story 模块测试</h1>
        <p>以下是我们添加的两个文本输入框：</p>
        
        <div class="story-image"></div>
        
        <div class="story-text-inputs">
            <div class="text-input-container">
                <label for="story-text-1" class="text-input-label">第一个文本</label>
                <input 
                    type="text" 
                    id="story-text-1" 
                    class="story-text-input" 
                    placeholder="请输入第一个文本内容..."
                />
            </div>
            <div class="text-input-container">
                <label for="story-text-2" class="text-input-label">第二个文本</label>
                <input 
                    type="text" 
                    id="story-text-2" 
                    class="story-text-input" 
                    placeholder="请输入第二个文本内容..."
                />
            </div>
        </div>
    </div>
</body>
</html>
