<!DOCTYPE html>
<html>
<head>
    <title>Image Debug Test</title>
    <style>
        .debug-container {
            margin: 20px;
            padding: 20px;
            border: 1px solid #ccc;
        }
        .visual-item {
            border: 2px solid red;
            margin: 10px;
            padding: 10px;
        }
        img {
            border: 2px solid blue;
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <div class="debug-container">
        <h2>Portrait Image Debug Test</h2>
        <p>如果图片不显示，请检查以下几点：</p>
        <ul>
            <li>确认在主题编辑器中已经上传了图片</li>
            <li>检查图片URL是否正确生成</li>
            <li>查看浏览器开发者工具中的网络请求</li>
            <li>确认图片没有被CSS隐藏</li>
        </ul>
        
        <div class="visual-item">
            <p>测试图片显示区域</p>
            <!-- 这里应该显示上传的图片 -->
        </div>
    </div>
</body>
</html>
