<!DOCTYPE html>
<html>
<head>
    <title>Test Giving Back Section</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-info { background: #f0f0f0; padding: 15px; margin-bottom: 20px; border-radius: 5px; }
        .success { color: green; }
        .warning { color: orange; }
    </style>
</head>
<body>
    <div class="test-info">
        <h2>测试说明</h2>
        <p>✅ <span class="success">文本模块已成功添加到Giving Back模块</span></p>
        <p>📍 <strong>位置：</strong>Highlight Text下方，CTA部分上方</p>
        <p>⚙️ <strong>功能：</strong>支持内容设置（标题和描述）</p>
        
        <h3>新增的设置选项：</h3>
        <ul>
            <li><strong>text_module_title</strong> - 文本模块标题</li>
            <li><strong>text_module_description</strong> - 文本模块描述（富文本）</li>
        </ul>
        
        <h3>如何验证：</h3>
        <ol>
            <li>进入Shopify主题编辑器</li>
            <li>找到"Giving Back"部分</li>
            <li>查看"Text Module Title"和"Text Module Description"设置项</li>
            <li>修改内容并保存，查看前端效果</li>
        </ol>
    </div>
</body>
</html>
