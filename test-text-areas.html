<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Story 文本框测试</title>
    <style>
        body {
            font-family: 'Noto Serif', serif;
            margin: 0;
            padding: 2rem;
            background: linear-gradient(135deg, #faf9f7 0%, #f5f3f0 50%, #e8e4de 100%);
        }
        
        .test-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 40px rgba(45, 36, 27, 0.1);
        }
        
        .story-image {
            width: 100%;
            height: 300px;
            background: #e8e4de;
            border-radius: 0.5rem;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8b7d68;
            font-size: 1.2rem;
        }
        
        /* 复制我们添加的文本框样式 */
        .story-text-areas {
            margin-top: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        
        .text-area-container {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .text-area-label {
            font-size: 0.875rem;
            font-weight: 500;
            color: #4a3f32;
            margin-bottom: 0.25rem;
        }
        
        .story-textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            font-family: inherit;
            color: #4a3f32;
            background-color: #ffffff;
            border: 1px solid #d1c7b8;
            border-radius: 0.5rem;
            transition: all 0.3s ease;
            box-shadow: 0 2px 4px rgba(45, 36, 27, 0.05);
            resize: vertical;
            min-height: 80px;
            line-height: 1.5;
        }
        
        .story-textarea:focus {
            outline: none;
            border-color: #5a7c5a;
            box-shadow: 0 0 0 3px rgba(90, 124, 90, 0.1);
        }
        
        .story-textarea::placeholder {
            color: #8b7d68;
            opacity: 0.7;
        }
        
        h1 {
            color: #4a3f32;
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .description {
            color: #8b7d68;
            text-align: center;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>Our Story 模块 - 文本框功能测试</h1>
        <p class="description">
            以下是在"our story"模块图片下方添加的两个可编辑文本框。这些文本框支持多行文本输入，
            可以在主题编辑器中自定义标签、占位符和默认内容。
        </p>
        
        <div class="story-image">图片区域示例</div>
        
        <div class="story-text-areas">
            <div class="text-area-container">
                <label for="story-textarea-1" class="text-area-label">第一个文本框</label>
                <textarea 
                    id="story-textarea-1" 
                    class="story-textarea" 
                    placeholder="请在此输入您的第一个文本内容..."
                    rows="3"
                ></textarea>
            </div>
            <div class="text-area-container">
                <label for="story-textarea-2" class="text-area-label">第二个文本框</label>
                <textarea 
                    id="story-textarea-2" 
                    class="story-textarea" 
                    placeholder="请在此输入您的第二个文本内容..."
                    rows="3"
                ></textarea>
            </div>
        </div>
        
        <div style="margin-top: 2rem; padding: 1rem; background: #f8f6f3; border-radius: 0.5rem;">
            <h3 style="color: #4a3f32; margin-top: 0;">功能特性：</h3>
            <ul style="color: #8b7d68; line-height: 1.8;">
                <li>支持多行文本输入</li>
                <li>可自定义标签文本</li>
                <li>可设置占位符提示</li>
                <li>支持默认内容设置</li>
                <li>可调整文本框行数（2-10行）</li>
                <li>响应式设计，适配移动端</li>
                <li>美观的焦点状态和交互效果</li>
            </ul>
        </div>
    </div>
</body>
</html>
