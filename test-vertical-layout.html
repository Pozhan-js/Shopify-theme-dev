<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image with Text - 上下布局测试</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 2rem;
            background: #f8f6f3;
        }
        
        .test-container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        
        .image-with-text-vertical__header {
            text-align: center;
            margin-bottom: 3rem;
        }
        
        .image-with-text-vertical__heading {
            font-size: 2.5rem;
            font-weight: 300;
            color: #2d241b;
            margin-bottom: 1rem;
        }
        
        .image-with-text-vertical__subheading {
            font-size: 1.25rem;
            color: #8b7d68;
            margin-bottom: 1.5rem;
        }
        
        .image-with-text-vertical__grid {
            display: flex;
            flex-direction: column;
            gap: 3rem;
        }
        
        .image-text-pair {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            align-items: center;
            padding: 1.5rem;
            background: #faf9f7;
            border-radius: 0.5rem;
        }
        
        .image-text-pair__image {
            width: 100%;
            max-width: 500px;
            height: 300px;
            background: linear-gradient(135deg, #e8e4de, #d1c7b8);
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8b7d68;
            font-size: 1.2rem;
            box-shadow: 0 4px 20px rgba(45, 36, 27, 0.1);
            transition: transform 0.3s ease;
        }
        
        .image-text-pair__image:hover {
            transform: translateY(-2px);
        }
        
        .image-text-pair__text-area {
            width: 100%;
            max-width: 500px;
        }
        
        .image-text-pair__label {
            font-size: 0.875rem;
            font-weight: 500;
            color: #2d241b;
            margin-bottom: 0.5rem;
            display: block;
        }
        
        .image-text-pair__textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            font-family: inherit;
            color: #2d241b;
            background-color: #ffffff;
            border: 1px solid #d1c7b8;
            border-radius: 0.5rem;
            transition: all 0.3s ease;
            box-shadow: 0 2px 4px rgba(45, 36, 27, 0.05);
            resize: vertical;
            min-height: 80px;
            line-height: 1.5;
        }
        
        .image-text-pair__textarea:focus {
            outline: none;
            border-color: #5a7c5a;
            box-shadow: 0 0 0 3px rgba(90, 124, 90, 0.1);
        }
        
        @media (min-width: 768px) {
            .image-text-pair {
                flex-direction: row;
                align-items: flex-start;
                gap: 2rem;
            }
            
            .image-text-pair:nth-child(even) {
                flex-direction: row-reverse;
            }
            
            .image-text-pair__image,
            .image-text-pair__text-area {
                flex: 1;
                max-width: 50%;
            }
        }
    </style>
</head>
<body>
    <div class="test-container">
        <div class="image-with-text-vertical__header">
            <h2 class="image-with-text-vertical__heading">上下布局演示</h2>
            <p class="image-with-text-vertical__subheading">每张图片匹配一个文本框</p>
        </div>
        
        <div class="image-with-text-vertical__grid">
            <!-- 图片1 + 文本框1 -->
            <div class="image-text-pair">
                <div class="image-text-pair__image">图片 1</div>
                <div class="image-text-pair__text-area">
                    <label class="image-text-pair__label">图片描述 1</label>
                    <textarea class="image-text-pair__textarea" placeholder="请输入图片1的描述..." rows="3"></textarea>
                </div>
            </div>
            
            <!-- 图片2 + 文本框2 -->
            <div class="image-text-pair">
                <div class="image-text-pair__image">图片 2</div>
                <div class="image-text-pair__text-area">
                    <label class="image-text-pair__label">图片描述 2</label>
                    <textarea class="image-text-pair__textarea" placeholder="请输入图片2的描述..." rows="3"></textarea>
                </div>
            </div>
            
            <!-- 图片3 + 文本框3 -->
            <div class="image-text-pair">
                <div class="image-text-pair__image">图片 3</div>
                <div class="image-text-pair__text-area">
                    <label class="image-text-pair__label">图片描述 3</label>
                    <textarea class="image-text-pair__textarea" placeholder="请输入图片3的描述..." rows="3"></textarea>
                </div>
            </div>
        </div>
        
        <div style="margin-top: 2rem; padding: 1.5rem; background: #f0ede7; border-radius: 0.5rem;">
            <h3 style="color: #2d241b; margin-top: 0;">功能特性：</h3>
            <ul style="color: #8b7d68; line-height: 1.8; margin: 0;">
                <li>✅ 上下布局设计</li>
                <li>✅ 每张图片匹配一个文本框</li>
                <li>✅ 支持1-3张图片</li>
                <li>✅ 响应式设计</li>
                <li>✅ 桌面端左右交替布局</li>
                <li>✅ 移动端垂直布局</li>
                <li>✅ 可自定义标签和占位符</li>
                <li>✅ 可调整文本框行数</li>
            </ul>
        </div>
    </div>
</body>
</html>
